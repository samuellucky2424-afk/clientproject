ole="status" style="text-align:center">Loading account access...</p><main id="authPanel" hidden><div class="tabs" role="tablist" aria-label="Account access"><button id="login" class="active" role="tab" aria-selected="true">Log In</button><button id="signup" role="tab" aria-selected="false">Sign Up</button></div><h1 id="heading">Welcome back</h1><p id="intro">Log in to your 2winprankz account.</p><form id="authForm"><div id="nameGroup" hidden><label for="name">Display name</label><input id="name" autocomplete="nickname" placeholder="Your name"></div><label for="email">Email address</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required><label for="password">Password</label><input id="password" type="password" autocomplete="off" placeholder="Enter your password" minlength="8" required><div class="agreement" id="agreementGroup" hidden><label for="agreeTerms"><input id="agreeTerms" type="checkbox"><span>I have read, understood, and agree to the <a href="/terms" target="_blank" rel="noopener">Safety Notice and Terms and Conditions</a>.</span></label><p class="agreement-hint">🟡 Agreement is required before signing up.</p></div><button class="submit" id="submit" type="submit">Log In</button></form><p id="message" role="status"></p><a class="back" href="/dashboard" style="font-weight:700">Go to dashboard →</a><a class="back" href="/">← Back to homepage</a></main><script type="module" src="auth.js"></script></body></html>
